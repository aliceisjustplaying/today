<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // If this page's own scripts or styles fail to load (a shell from an older deploy whose
      // assets are gone), drop the service worker and its caches and reload once.
      addEventListener(
        "error",
        function (event) {
          var el = event.target;
          var url = el && (el.src || el.href);
          if (!url || url.indexOf(location.origin + "/assets/") !== 0) return;
          if (sessionStorage.getItem("today.bootRetry")) return;
          sessionStorage.setItem("today.bootRetry", "1");
          var sw = navigator.serviceWorker;
          Promise.resolve(sw && sw.getRegistrations())
            .then(function (regs) {
              return Promise.all((regs || []).map(function (r) { return r.unregister(); }));
            })
            .then(function () {
              return window.caches && caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              });
            })
            .finally(function () { location.reload(); });
        },
        true,
      );
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      crossorigin
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Hanken+Grotesk:ital,wght@0,400..700;1,400..600&display=swap"
    />
    <title>today</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
